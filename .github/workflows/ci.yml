name: CI

on:
  pull_request:
    branches: [ dev, master ] # dev/master로 들어오는 PR 빌드·테스트 검증

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 소스코드 가져오기
      - name: 소스 코드 가져오기
        uses: actions/checkout@v4

      # 자바 환경 셋팅
      - name: 자바 환경 셋팅
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 테스트는 H2(PostgreSQL 모드)로 실행
      - name: maven 빌드 및 테스트
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify
