<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{fragments/head :: head(${memoId == null} ? '새 메모' : '메모 수정')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/memo-form.css}">
    <script th:src="@{/js/memo-form.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container container--narrow">
    <div class="page-head">
        <div>
            <h1 class="page-head__title" th:text="${memoId == null} ? '새 메모' : '메모 수정'">새 메모</h1>
            <p class="page-head__desc" th:text="${memoId == null} ? '회의·학습 내용을 자유롭게 적어주세요.' : '제목과 본문을 수정할 수 있어요.'">
                회의·학습 내용을 자유롭게 적어주세요.
            </p>
        </div>
    </div>

    <form class="memo-form card" th:action="${memoId == null} ? @{/memos} : @{/memos/{id}(id=${memoId})}" th:object="${memoRequest}" method="post" novalidate data-memo-form>
        <div class="field">
            <label class="field__label" for="title">제목</label>
            <input class="field__input" id="title" type="text" th:field="*{title}"
                   th:classappend="${#fields.hasErrors('title')} ? 'field__input--error'"
                   placeholder="예) 9월 4주차 주간 회의" maxlength="200" autocomplete="off" required autofocus>
            <p class="field__error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">제목을 입력해주세요.</p>
        </div>

        <div class="field">
            <div class="field__label-row">
                <label class="field__label" for="content">본문</label>
                <span class="field__counter" data-counter-for="content">0 / 20,000</span>
            </div>
            <textarea class="field__input field__textarea" id="content" th:field="*{content}"
                      th:classappend="${#fields.hasErrors('content')} ? 'field__input--error'"
                      placeholder="메모 내용을 입력하세요." maxlength="20000" rows="16" required></textarea>
            <p class="field__error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">본문을 입력해주세요.</p>
        </div>

        <div class="memo-form__actions">
            <span class="memo-form__hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 로 저장</span>
            <div class="memo-form__buttons">
                <a class="btn" th:href="${memoId == null} ? @{/memos} : @{/memos/{id}(id=${memoId})}">취소</a>
                <button class="btn btn--primary" type="submit" data-submit>저장</button>
            </div>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
