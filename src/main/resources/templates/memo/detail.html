<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{fragments/head :: head(${memo.title})}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/memo-detail.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container">
    <a class="back-link" th:href="@{/memos}">‹ 메모 목록</a>

    <div class="detail-head">
        <div class="detail-head__text">
            <h1 class="detail-head__title" th:text="${memo.title}">메모 제목</h1>
            <p class="detail-head__meta">
                <span>작성 <time th:datetime="${memo.createdAt}"
                               th:text="${#temporals.format(memo.createdAt, 'yyyy.MM.dd HH:mm')}">2026.09.28 14:00</time></span>
                <span th:if="${memo.updatedAt != null and memo.updatedAt.isAfter(memo.createdAt)}">
                    · 수정 <time th:datetime="${memo.updatedAt}"
                               th:text="${#temporals.format(memo.updatedAt, 'yyyy.MM.dd HH:mm')}">2026.09.28 15:00</time>
                </span>
            </p>
        </div>
        <div class="detail-head__actions">
            <a class="btn btn--sm" th:href="@{/memos/{id}/edit(id=${memo.memoId})}">수정</a>
            <form th:action="@{/memos/{id}/delete(id=${memo.memoId})}" method="post"
                  data-confirm="이 메모를 삭제할까요? 삭제한 메모는 복구할 수 없어요.">
                <button class="btn btn--sm btn--danger" type="submit">삭제</button>
            </form>
        </div>
    </div>

    <div class="detail-layout">
        <section class="detail-content card" aria-labelledby="content-title">
            <h2 class="section-title" id="content-title">원문</h2>
            <div class="detail-content__body" th:text="${memo.content}">메모 본문</div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
