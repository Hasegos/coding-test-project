<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{fragments/head :: head('메모 목록')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/memo-list.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container">
    <div class="page-head">
        <div>
            <h1 class="page-head__title">내 메모</h1>
            <p class="page-head__desc">
                <th:block th:if="${keyword.isEmpty()}">
                    전체 <strong th:text="${memos.totalElements}">0</strong>개의 메모
                </th:block>
                <th:block th:unless="${keyword.isEmpty()}">
                    '<strong th:text="${keyword}">키워드</strong>' 검색 결과
                    <strong th:text="${memos.totalElements}">0</strong>개
                </th:block>
            </p>
        </div>

        <form class="search" th:action="@{/memos}" method="get" role="search">
            <label class="visually-hidden" for="keyword">메모 검색</label>
            <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <path d="m20 20-3.5-3.5"/>
            </svg>
            <input class="search__input" id="keyword" type="search" name="keyword" th:value="${keyword}"
                   placeholder="제목·본문 검색" maxlength="100" autocomplete="off">
            <a class="search__clear" th:unless="${keyword.isEmpty()}" th:href="@{/memos}" aria-label="검색 초기화">✕</a>
        </form>
    </div>

    <!-- 메모 목록 -->
    <ul class="memo-grid" th:unless="${memos.isEmpty()}">
        <li th:each="memo : ${memos.content}">
            <a class="memo-card card" th:href="@{/memos/{id}(id=${memo.memoId})}">
                <div class="memo-card__head">
                    <h2 class="memo-card__title" th:text="${memo.title}">메모 제목</h2>
                </div>
                <p class="memo-card__preview" th:text="${memo.preview}">본문 미리보기</p>
                <div class="memo-card__meta">
                    <time th:datetime="${memo.createdAt}"
                          th:text="${#temporals.format(memo.createdAt, 'yyyy.MM.dd HH:mm')}">2026.09.28 14:00</time>
                </div>
            </a>
        </li>
    </ul>

    <!-- 빈 상태 -->
    <div class="empty card" th:if="${memos.isEmpty()}">
        <div class="empty__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                <path d="M14 3v6h6"/>
            </svg>
        </div>
        <th:block th:if="${keyword.isEmpty()}">
            <p class="empty__title">아직 작성한 메모가 없어요</p>
            <p class="empty__desc">첫 메모를 작성해보세요.</p>
            <a class="btn btn--primary" th:href="@{/memos/new}">＋ 새 메모 작성</a>
        </th:block>
        <th:block th:unless="${keyword.isEmpty()}">
            <p class="empty__title">검색 결과가 없어요</p>
            <p class="empty__desc">다른 키워드로 검색해보세요.</p>
            <a class="btn" th:href="@{/memos}">전체 메모 보기</a>
        </th:block>
    </div>

    <!-- 페이지네이션 -->
    <nav class="pagination" th:if="${memos.totalPages > 1}" aria-label="페이지 이동">
        <a class="pagination__item" th:classappend="${memos.first} ? 'pagination__item--disabled'"
           th:href="@{/memos(keyword=${keyword.isEmpty()} ? null : ${keyword}, page=${memos.number - 1})}"
           aria-label="이전 페이지">‹</a>
        <a class="pagination__item" th:each="num : ${pageNumbers}"
           th:classappend="${num == memos.number} ? 'pagination__item--active'"
           th:attr="aria-current=${num == memos.number} ? 'page' : null"
           th:href="@{/memos(keyword=${keyword.isEmpty()} ? null : ${keyword}, page=${num})}"
           th:text="${num + 1}">1</a>
        <a class="pagination__item" th:classappend="${memos.last} ? 'pagination__item--disabled'"
           th:href="@{/memos(keyword=${keyword.isEmpty()} ? null : ${keyword}, page=${memos.number + 1})}"
           aria-label="다음 페이지">›</a>
    </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
