<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{fragments/head :: head('회원가입')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/pages/auth.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container auth">
    <section class="auth__card card">
        <h1 class="auth__title">회원가입</h1>
        <p class="auth__desc">로그인에 쓸 아이디·비밀번호와 닉네임을 정해주세요.</p>

        <form class="auth__form" th:action="@{/signup}" th:object="${signupRequest}" method="post" novalidate>
            <div class="field">
                <label class="field__label" for="username">아이디</label>
                <input class="field__input" id="username" type="text" th:field="*{username}"
                       th:classappend="${#fields.hasErrors('username')} ? 'field__input--error'"
                       maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
                <p class="field__hint" th:unless="${#fields.hasErrors('username')}">영문 소문자·숫자·밑줄(_) 4~20자</p>
                <p class="field__error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>
            <div class="field">
                <label class="field__label" for="password">비밀번호</label>
                <input class="field__input" id="password" type="password" th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? 'field__input--error'"
                       maxlength="64" autocomplete="new-password" required>
                <p class="field__hint" th:unless="${#fields.hasErrors('password')}">영문과 숫자를 포함해 8~64자</p>
                <p class="field__error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div class="field">
                <label class="field__label" for="passwordConfirm">비밀번호 확인</label>
                <input class="field__input" id="passwordConfirm" type="password" th:field="*{passwordConfirm}"
                       th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'field__input--error'"
                       maxlength="64" autocomplete="new-password" required>
                <p class="field__error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>
            </div>
            <div class="field">
                <label class="field__label" for="nickname">닉네임</label>
                <input class="field__input" id="nickname" type="text" th:field="*{nickname}"
                       th:classappend="${#fields.hasErrors('nickname')} ? 'field__input--error'"
                       maxlength="12" autocomplete="nickname" required>
                <p class="field__hint" th:unless="${#fields.hasErrors('nickname')}">한글·영문·숫자·밑줄(_) 2~12자, 우측 상단에 표시돼요</p>
                <p class="field__error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
            </div>
            <button class="btn btn--primary auth__submit" type="submit">가입하기</button>
        </form>

        <p class="auth__switch">
            이미 회원이신가요? <a th:href="@{/login}">로그인</a>
        </p>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
