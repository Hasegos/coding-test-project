<!-- LLM 서버 미설정 안내 (메모 목록·상세 공통) -->
<div class="notice" th:fragment="notice" th:if="${llmConfigured == false}" role="status">
    <p class="notice__text">
        <strong>LLM 서버가 아직 연결되지 않았어요.</strong>
        메모는 저장되지만, 요약은 LLM 설정을 마친 뒤 진행돼요.
    </p>
    <a class="btn btn--sm btn--primary" th:href="@{/settings/llm}">LLM 설정하기</a>
</div>
