<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="메모를 저장하면 로컬 LLM이 자동으로 요약하고 할 일을 추출해주는 AI 메모 정리 서비스">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${title} + ' | AI Memo'">AI Memo</title>

    <!-- CSRF 토큰: JS 변경 요청(POST/PUT/DELETE) 헤더에 사용 -->
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">

    <!-- 테마 깜빡임 방지: CSS 로딩 전에 저장된 테마 적용 -->
    <script th:src="@{/js/theme-init.js}"></script>

    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/common/reset.css}">
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/common/header.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">
    <script th:src="@{/js/common.js}" defer></script>
</th:block>
