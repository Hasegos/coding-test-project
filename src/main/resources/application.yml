server:
  port: 8083
  shutdown: graceful
  compression: # HTML·CSS·JS·JSON 응답 gzip 압축 (1KB 이상)
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
    min-response-size: 1KB
  servlet:
    session:
      tracking-modes: cookie # flash 메시지용 세션 ID가 리다이렉트 URL(;jsessionid=)에 노출되지 않도록 쿠키만 사용
      cookie:
        http-only: true      # JS에서 세션 쿠키 접근 차단
        same-site: lax       # 다른 사이트에서 보내는 POST 요청에 세션 쿠키 미포함 (CSRF 1차 방어)

spring:
  application:
    name: ai-memo

  profiles:
    default: dev

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST:localhost}:${POSTGRESQL_PORT:5432}/${POSTGRESQL_DATABASE}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  web:
    resources:
      chain:
        strategy:
          content: # 파일 내용 해시를 URL에 붙여(예: common-3f2a….css) 변경 시에만 새로 받도록 함
            enabled: true
            paths: /**
      cache:
        cachecontrol: # 해시가 붙은 정적 리소스는 1년 캐시
          max-age: 365d
          cache-public: true

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

# LLM API Key 암호화 키 (AES-256, 32바이트 Base64) — 생성: openssl rand -base64 32
# 키를 바꾸면 기존에 저장한 API Key는 복호화할 수 없으므로 다시 입력해야 한다.
app:
  crypto:
    secret-key: ${API_KEY_ENCRYPTION_KEY:}
  login-attempt:          # 로그인 시도 제한 — 비밀번호가 틀린 횟수 기준 (형식 오류는 세지 않음)
    max-failures: 5       # 같은 IP·아이디로 5회 틀리면 잠금
    ip-max-failures: 20   # 같은 IP에서 아이디를 바꿔 가며 20회 틀리면 그 IP 전체 잠금
    lock-duration: 5m     # 잠금 시간, 마지막 실패 후 이 시간이 지나면 실패 횟수도 초기화

# 로컬 LLM 호출 공통 설정 — 서버 IP·포트·모델은 화면의 'LLM 설정'에서 입력(DB 저장)
llm:
  temperature: 0.2
  connect-timeout: 5s
  read-timeout: 120s      # 요약 요청 전체 제한 시간 (응답 본문 수신까지)
  models-timeout: 15s     # 모델 목록 조회(연결 테스트) 전체 제한 시간
  max-response-size: 1MB  # 응답 본문 최대 크기
  concurrency: 1          # LLM 서버 하나에 동시에 보낼 요약 수 (GPU 1장이면 1 권장)
  queue-capacity: 100     # LLM 서버 하나의 요약 대기열 크기
  max-parallel: 8         # 전체 동시 요약 수 (서로 다른 LLM 서버는 동시에 처리)
  guard:                  # 회원이 입력하는 LLM 서버 주소 제한 (서버가 속한 내부망 탐색 방지)
    allowed-networks: []  # 허용 대역(CIDR), 비우면 사설망·Tailscale 전체 — 예: Tailscale만 [100.64.0.0/10]
    allowed-ports: [1234, 11434]  # 허용 포트 (LM Studio, Ollama 기본값), 비우면 전체
    probe-limit: 10       # 회원 한 명의 연결 테스트·서버 주소 변경 횟수
    probe-window: 1m      # 위 횟수를 세는 시간
