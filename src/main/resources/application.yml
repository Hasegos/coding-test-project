server:
  port: 8083
  shutdown: graceful
  servlet:
    session:
      tracking-modes: cookie # flash 메시지용 세션 ID가 리다이렉트 URL(;jsessionid=)에 노출되지 않도록 쿠키만 사용
      cookie:
        http-only: true      # JS에서 세션 쿠키 접근 차단
        same-site: lax       # 다른 사이트에서 보내는 POST 요청에 세션 쿠키 미포함 (CSRF 1차 방어)

spring:
  application:
    name: ai-memo

  profiles:
    default: dev

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST:localhost}:${POSTGRESQL_PORT:5432}/${POSTGRESQL_DATABASE}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

# 로컬 LLM 호출 공통 설정 — 서버 IP·포트·모델은 화면의 'LLM 설정'에서 입력(DB 저장)
llm:
  temperature: 0.2
  connect-timeout: 5s
  read-timeout: 120s
  concurrency: 1          # 동시 요약 수 (GPU 1장이면 1 권장)
  queue-capacity: 100
